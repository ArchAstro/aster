name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  checks: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.88"
          components: clippy, rustfmt
      - name: Validate tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "v${version}" = "${GITHUB_REF_NAME}"
          test "${version}" = "${package_version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      # cargo-audit's own dependencies may require a newer compiler than Aster's
      # MSRV. Keep Aster validation on 1.88, then install and run the audit tool
      # with the current stable toolchain.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: aster-linux-x64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: aster-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: aster-darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Smoke test
        run: target/${{ matrix.target }}/release/aster --version
      - name: Package
        shell: bash
        run: |
          mkdir dist
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" aster \
            -C "${GITHUB_WORKSPACE}" LICENSE
      - name: Install nFPM
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          scripts/install-nfpm "${RUNNER_TEMP}/nfpm"
          echo "${RUNNER_TEMP}/nfpm" >> "${GITHUB_PATH}"
      - name: Build native Linux packages
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          NFPM_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          test -n "${PACKAGE_SIGNING_KEY}"
          install -m 600 /dev/null "${RUNNER_TEMP}/package-signing-key.asc"
          printf '%s' "${PACKAGE_SIGNING_KEY}" > "${RUNNER_TEMP}/package-signing-key.asc"
          export ASTER_SIGNING_KEY_FILE="${RUNNER_TEMP}/package-signing-key.asc"
          scripts/package-linux "${{ needs.verify.outputs.version }}" "target/${{ matrix.target }}/release/aster" dist
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          gpg --batch --import "${ASTER_SIGNING_KEY_FILE}"
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          gpg --batch --armor --export "${fingerprint}" > dist/aster-archive-keyring.asc
      - name: Smoke-test native Linux packages
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: scripts/test-linux-packages "${{ needs.verify.outputs.version }}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Create checksums
        run: |
          mkdir release-assets
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name 'aster-archive-keyring.asc' \) \
            -exec cp '{}' release-assets/ \;
          cd release-assets
          sha256sum ./* | sed 's#  \./#  #' > ../SHA256SUMS
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: release-assets/*
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release-assets/*
            SHA256SUMS
          generate_release_notes: true
          make_latest: legacy

  publication-freshness:
    name: Check publication freshness
    needs: release
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.latest.outputs.should_publish }}
    steps:
      - name: Compare with latest release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          newest_tag="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              sed -n '/^v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*$/p' |
              sort --version-sort |
              tail -1
          )"
          test -n "${newest_tag}"
          if [[ "${GITHUB_REF_NAME}" == "${newest_tag}" ]]; then
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Skipping stale ${GITHUB_REF_NAME}; newest release is ${newest_tag}"
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
          fi

  publish-linux-repositories:
    name: Publish APT and Yum repositories
    if: vars.PACKAGE_REPOSITORIES_ENABLED == 'true' && needs.publication-freshness.outputs.should_publish == 'true'
    needs: [verify, release, publication-freshness]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: aster-linux-repository-publishing
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download released Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir released-packages
          # shellcheck disable=SC2016 # $release is a jq variable.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '
              .[]
              | select(.draft == false and .prerelease == false)
              | . as $release
              | $release.assets[]
              | select(
                  (.name | test("^aster_.*_amd64\\.deb$"))
                  or (
                    (.name | test("^aster-.*\\.x86_64\\.rpm$"))
                    and any($release.assets[]; .name == "aster-archive-keyring.asc")
                  )
                )
              | [.id, .name]
              | @tsv
            ' |
            while IFS=$'\t' read -r asset_id asset_name; do
              gh api \
                --header 'Accept: application/octet-stream' \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "released-packages/${asset_name}"
            done
          test -n "$(find released-packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find released-packages -maxdepth 1 -name '*.rpm' -print -quit)"
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils createrepo-c dpkg-dev
      - name: Build and test repositories
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
          PACKAGE_SIGNING_PUBLIC_KEYS: ${{ secrets.PACKAGE_SIGNING_PUBLIC_KEYS }}
          PACKAGE_REPOSITORY_URL: ${{ vars.PACKAGE_REPOSITORY_URL }}
        run: |
          test -n "${PACKAGE_SIGNING_KEY}"
          test -n "${PACKAGE_REPOSITORY_URL}"
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          if [[ -n "${PACKAGE_SIGNING_PUBLIC_KEYS}" ]]; then
            printf '%s' "${PACKAGE_SIGNING_PUBLIC_KEYS}" | gpg --batch --import
          fi
          printf '%s' "${PACKAGE_SIGNING_KEY}" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          scripts/build-linux-repositories \
            released-packages package-repositories "${PACKAGE_REPOSITORY_URL}" \
            "${fingerprint}" "${{ needs.verify.outputs.version }}"
          scripts/test-linux-repositories "${{ needs.verify.outputs.version }}" package-repositories
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: package-repositories
      - name: Deploy package repositories
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  update-aur:
    name: Update AUR package
    if: vars.AUR_PUBLISH_ENABLED == 'true' && needs.publication-freshness.outputs.should_publish == 'true' && github.event.repository.visibility == 'public'
    needs: [verify, release, publication-freshness]
    runs-on: ubuntu-latest
    concurrency:
      group: aster-aur-publishing
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aster-linux-x64
          path: artifacts
      - name: Render AUR recipe
        run: |
          archive_sha256="$(sha256sum artifacts/aster-linux-x64.tar.gz | cut -d' ' -f1)"
          scripts/render-aur-package "${{ needs.verify.outputs.version }}" "${archive_sha256}" aur-package
      - name: Publish AUR recipe
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "${AUR_SSH_PRIVATE_KEY}"
          mkdir -m 700 "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/aur"
          printf '%s' "${AUR_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/aur"
          cat > "${HOME}/.ssh/known_hosts" <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/aur -o IdentitiesOnly=yes"
          git -c init.defaultBranch=master clone ssh://aur@aur.archlinux.org/aster-bin.git aur
          install -m 644 aur-package/PKGBUILD aur/PKGBUILD
          install -m 644 aur-package/.SRCINFO aur/.SRCINFO
          install -m 644 aur-package/LICENSE aur/LICENSE
          cd aur
          git config user.name "ArchAstro release automation"
          git config user.email "aster@archastro.ai"
          git add PKGBUILD .SRCINFO LICENSE
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update to ${{ needs.verify.outputs.version }}"
          git push origin master

  update-homebrew:
    name: Update Homebrew tap
    if: needs.publication-freshness.outputs.should_publish == 'true' && github.event.repository.visibility == 'public'
    needs: [verify, release, publication-freshness]
    runs-on: ubuntu-latest
    concurrency:
      group: aster-homebrew-publishing
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Calculate checksums
        id: checksums
        run: |
          {
            echo "darwin_arm64=$(sha256sum artifacts/aster-darwin-arm64/aster-darwin-arm64.tar.gz | cut -d' ' -f1)"
            echo "darwin_x64=$(sha256sum artifacts/aster-darwin-x64/aster-darwin-x64.tar.gz | cut -d' ' -f1)"
            echo "linux_x64=$(sha256sum artifacts/aster-linux-x64/aster-linux-x64.tar.gz | cut -d' ' -f1)"
          } >> "${GITHUB_OUTPUT}"
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.ARCHASTRO_RELEASE_GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.checksums.outputs.darwin_arm64 }}
          SHA_DARWIN_X64: ${{ steps.checksums.outputs.darwin_x64 }}
          SHA_LINUX_X64: ${{ steps.checksums.outputs.linux_x64 }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "ARCHASTRO_RELEASE_GITHUB_TOKEN is not configured" >&2
            exit 1
          fi
          gh auth setup-git
          git clone https://github.com/ArchAstro/homebrew-tools.git "${RUNNER_TEMP}/homebrew-tools"
          cd "${RUNNER_TEMP}/homebrew-tools"
          mkdir -p Formula
          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA_DARWIN_ARM64__/${SHA_DARWIN_ARM64}/g" \
            -e "s/__SHA_DARWIN_X64__/${SHA_DARWIN_X64}/g" \
            -e "s/__SHA_LINUX_X64__/${SHA_LINUX_X64}/g" \
            "${GITHUB_WORKSPACE}/.github/homebrew/aster.rb.template" > Formula/aster.rb
          ruby -c Formula/aster.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/aster.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already current"
            exit 0
          fi
          git commit -m "Update aster to ${VERSION}"
          git push origin main
