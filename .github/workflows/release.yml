name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy, rustfmt
      - name: Validate tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "v${version}" = "${GITHUB_REF_NAME}"
          test "${version}" = "${package_version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: aster-linux-x64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: aster-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: aster-darwin-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Smoke test
        run: target/${{ matrix.target }}/release/aster --version
      - name: Package
        shell: bash
        run: tar -C "target/${{ matrix.target }}/release" -czf "${{ matrix.artifact }}.tar.gz" aster
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Create checksums
        run: |
          mkdir release-assets
          find artifacts -name '*.tar.gz' -exec cp '{}' release-assets/ \;
          cd release-assets
          sha256sum ./*.tar.gz | sed 's#  \./#  #' > ../SHA256SUMS
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: release-assets/*.tar.gz
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-assets/*.tar.gz
            SHA256SUMS
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew tap
    needs: [verify, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Calculate checksums
        id: checksums
        run: |
          {
            echo "darwin_arm64=$(sha256sum artifacts/aster-darwin-arm64/aster-darwin-arm64.tar.gz | cut -d' ' -f1)"
            echo "darwin_x64=$(sha256sum artifacts/aster-darwin-x64/aster-darwin-x64.tar.gz | cut -d' ' -f1)"
            echo "linux_x64=$(sha256sum artifacts/aster-linux-x64/aster-linux-x64.tar.gz | cut -d' ' -f1)"
          } >> "${GITHUB_OUTPUT}"
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.checksums.outputs.darwin_arm64 }}
          SHA_DARWIN_X64: ${{ steps.checksums.outputs.darwin_x64 }}
          SHA_LINUX_X64: ${{ steps.checksums.outputs.linux_x64 }}
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone ArchAstro/homebrew-tap
          cd homebrew-tap
          mkdir -p Formula
          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA_DARWIN_ARM64__/${SHA_DARWIN_ARM64}/g" \
            -e "s/__SHA_DARWIN_X64__/${SHA_DARWIN_X64}/g" \
            -e "s/__SHA_LINUX_X64__/${SHA_LINUX_X64}/g" \
            ../.github/homebrew/aster.rb.template > Formula/aster.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/aster.rb
          git commit -m "Update aster to ${VERSION}"
          git push
