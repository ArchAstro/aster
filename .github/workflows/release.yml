name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: aster-linux-x64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: aster-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: aster-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz aster
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Calculate checksums
        id: checksums
        run: |
          echo "darwin_arm64=$(sha256sum artifacts/aster-darwin-arm64/aster-darwin-arm64.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "darwin_x64=$(sha256sum artifacts/aster-darwin-x64/aster-darwin-x64.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "linux_x64=$(sha256sum artifacts/aster-linux-x64/aster-linux-x64.tar.gz | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.checksums.outputs.darwin_arm64 }}
          SHA_DARWIN_X64: ${{ steps.checksums.outputs.darwin_x64 }}
          SHA_LINUX_X64: ${{ steps.checksums.outputs.linux_x64 }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/ArchAstro/homebrew-tap.git
          cd homebrew-tap

          cat > Formula/aster.rb << 'FORMULA'
          require "download_strategy"

          class GitHubPrivateRepositoryReleaseDownloadStrategy < CurlDownloadStrategy
            def initialize(url, name, version, **meta)
              super
              parse_url_pattern
              set_github_token
            end

            def parse_url_pattern
              url_pattern = %r{https://github\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/(\S+)}
              unless @url =~ url_pattern
                raise CurlDownloadStrategyError, "Invalid GitHub release URL pattern"
              end
              _, @owner, @repo, @tag, @filename = *@url.match(url_pattern)
            end

            def set_github_token
              @github_token = ENV["HOMEBREW_GITHUB_API_TOKEN"]
              unless @github_token
                raise CurlDownloadStrategyError, "HOMEBREW_GITHUB_API_TOKEN is required"
              end
            end

            def _fetch(url:, resolved_url:, timeout:)
              api_url = "https://api.github.com/repos/#{@owner}/#{@repo}/releases/tags/#{@tag}"
              assets_json = Utils::Curl.curl_output(
                "--header", "Authorization: token #{@github_token}",
                "--header", "Accept: application/vnd.github.v3+json",
                api_url
              ).stdout
              require "json"
              release = JSON.parse(assets_json)
              asset = release["assets"].find { |a| a["name"] == @filename }
              unless asset
                raise CurlDownloadStrategyError, "Asset #{@filename} not found in release #{@tag}"
              end
              curl_download(
                "--header", "Authorization: token #{@github_token}",
                "--header", "Accept: application/octet-stream",
                asset["url"],
                to: temporary_path,
                timeout: timeout
              )
            end
          end
          FORMULA

          cat >> Formula/aster.rb << EOF

          class Aster < Formula
            desc "Build orchestration for polyglot monorepos"
            homepage "https://github.com/ArchAstro/aster"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/ArchAstro/aster/releases/download/v${VERSION}/aster-darwin-arm64.tar.gz",
                    using: GitHubPrivateRepositoryReleaseDownloadStrategy
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/ArchAstro/aster/releases/download/v${VERSION}/aster-darwin-x64.tar.gz",
                    using: GitHubPrivateRepositoryReleaseDownloadStrategy
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              url "https://github.com/ArchAstro/aster/releases/download/v${VERSION}/aster-linux-x64.tar.gz",
                  using: GitHubPrivateRepositoryReleaseDownloadStrategy
              sha256 "${SHA_LINUX_X64}"
            end

            def install
              bin.install "aster"
            end

            test do
              system "#{bin}/aster", "--version"
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/aster.rb
          git commit -m "Update aster to ${VERSION}"
          git push
