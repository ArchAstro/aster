[package]
name = "aster"
version = "0.12.0"
edition = "2021"
rust-version = "1.88"
description = "Build orchestration for polyglot monorepos"
license = "MIT"
repository = "https://github.com/ArchAstro/aster"
homepage = "https://github.com/ArchAstro/aster"
readme = "README.md"
keywords = ["build", "monorepo", "polyglot", "task-runner"]
categories = ["command-line-utilities", "development-tools::build-utils"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/GETTING_STARTED.MD",
    "/LICENSE",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
petgraph = "0.8"
ignore = "=0.4.31"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
regex = "1.10"
roxmltree = "0.21"
git2 = "0.21"
console = "0.16"
indicatif = "0.18"
chrono = { version = "0.4", features = ["clock"] }
globset = "0.4"
getrandom = "0.4"
fs2 = "0.4"
sha2 = "0.11"
walkdir = "2"
libc = "0.2"
notify = "8.2"
crossbeam-channel = "0.5"
humantime = "2.1"
shell-words = "1.1"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = "0.26"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2.0"
predicates = "3.1"
dirs = "6.0"
rcgen = "0.14"
