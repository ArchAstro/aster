[package]
name = "aster"
version = "0.22.0"
edition = "2021"
rust-version = "1.88"
description = "Build orchestration for polyglot monorepos"
license = "MIT"
repository = "https://github.com/ArchAstro/aster"
homepage = "https://github.com/ArchAstro/aster"
readme = "README.md"
keywords = ["build", "monorepo", "polyglot", "task-runner"]
categories = ["command-line-utilities", "development-tools::build-utils"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/GETTING_STARTED.MD",
    "/LICENSE",
]

[workspace]
members = [".", "crates/aster-results-model", "crates/aster-srv"]
resolver = "2"

[dependencies]
aster-results-model = { path = "crates/aster-results-model" }
clap = { version = "4.5", features = ["derive"] }
petgraph = "0.8"
ignore = "=0.4.31"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
regex = "1.10"
roxmltree = "0.21"
git2 = "0.21"
console = "0.16"
indicatif = "0.18"
chrono = { version = "0.4", features = ["clock"] }
globset = "0.4"
getrandom = "0.4"
flate2 = "1"
fs2 = "0.4"
sha2 = "0.11"
hmac = "0.13"
zstd = "0.13"
tempfile = "3"
walkdir = "2"
libc = "0.2"
notify = "8.2"
crossbeam-channel = "0.5"
humantime = "2.1"
shell-words = "1.1"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = "0.26"
tree-sitter = "0.26.13"
# 0.1.8 requires Rust 1.90; Aster supports 1.88.
tree-sitter-language = "=0.1.7"
tree-sitter-elixir = "0.3.5"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
ureq = { version = "3", default-features = false, features = [
    "json",
    "rustls-no-provider",
    "rustls-webpki-roots",
] }
base64 = "0.22"
# Direct so the cache client can pass aws-lc-rs to ureq. ureq's `rustls`
# feature would also install ring and panic ServerConfig::builder() in
# src/dev/tls.rs. Keep this on the same rustls major as tokio-rustls.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
dirs = "6.0"
rcgen = "0.14"
aster-srv = { path = "crates/aster-srv" }
jsonwebtoken = "9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
