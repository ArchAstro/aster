[package]
name = "aster"
version = "0.3.2"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
petgraph = "0.8"
ignore = "0.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"
git2 = "0.19"
console = "0.16"
indicatif = "0.17"
chrono = { version = "0.4", features = ["clock"] }
globset = "0.4"
fs2 = "0.4"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2.0"
predicates = "3.1"
dirs = "5.0"
